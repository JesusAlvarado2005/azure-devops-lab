apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        image: catalog-backend:ud16
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: catalog-config
        env:
        - name: DEMO_SECRET
          valueFrom:
            secretKeyRef:
              name: catalog-demo
              key: demo
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: runtime
          mountPath: /runtime
        - name: config-file
          mountPath: /etc/catalog-config
          readOnly: true
      volumes:
      - name: config-file
        configMap:
          name: catalog-config
      - name: runtime
        persistentVolumeClaim:
          claimName: catalog-runtime

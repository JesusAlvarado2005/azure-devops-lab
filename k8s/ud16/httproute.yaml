apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog
  namespace: ft152-catalogo
spec:
  parentRefs:
  - name: catalog
  hostnames:
  - catalogo.lab
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 80
